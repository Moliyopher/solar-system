<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>太阳系 · 真实轨道模拟器</title>
<style>
  :root{
    --bg:#04060d;
    --panel:rgba(12,18,32,.78);
    --panel-brd:rgba(120,170,255,.18);
    --txt:#dfe8f7;
    --dim:#8fa2c0;
    --accent:#63b8ff;
    --accent2:#ffd45e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none}
  /* numbers in the panels should stay copyable even though the canvas must not select */
  #topbar,#leftPanel,#rightPanel{user-select:text}
  #topbar button,#leftPanel button,#rightPanel button,.bodyRow,.brand{user-select:none}
  #view{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #view.dragging{cursor:grabbing}

  .panel{background:var(--panel);border:1px solid var(--panel-brd);border-radius:12px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 8px 32px rgba(0,0,0,.5)}
  .sub{color:var(--dim);font-size:11px}
  .mono{font-family:ui-monospace,Consolas,"Courier New",monospace;font-variant-numeric:tabular-nums}

  /* ---------- top bar ---------- */
  #topbar{position:fixed;top:10px;left:10px;right:10px;z-index:20;
    display:flex;align-items:center;gap:14px;padding:9px 14px;flex-wrap:wrap}
  .brand{font-size:14px;font-weight:600;letter-spacing:.5px;white-space:nowrap}
  .brand b{color:var(--accent2)}
  #clock{line-height:1.25;min-width:186px}
  #dateText{font-size:14px;font-weight:600;letter-spacing:.3px}
  .tgroup{display:flex;align-items:center;gap:6px}
  button{background:rgba(255,255,255,.06);color:var(--txt);border:1px solid rgba(160,200,255,.22);
    border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer;transition:.15s;font-family:inherit}
  button:hover{background:rgba(120,180,255,.22);border-color:var(--accent)}
  button.on{background:rgba(99,184,255,.3);border-color:var(--accent);color:#fff}
  button.primary{background:rgba(99,184,255,.18);border-color:rgba(99,184,255,.6)}
  select,input[type=datetime-local]{background:rgba(255,255,255,.06);color:var(--txt);
    border:1px solid rgba(160,200,255,.22);border-radius:8px;padding:5px 7px;font-size:12px;
    font-family:inherit;outline:none}
  select option{background:#0b1220}
  input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:3px;
    background:rgba(255,255,255,.16);outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:var(--accent);cursor:pointer;box-shadow:0 0 8px rgba(99,184,255,.8)}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:var(--accent)}
  #speedSlider{width:120px}
  #speedText{font-size:12px;min-width:96px;color:var(--accent)}
  .sep{width:1px;height:22px;background:rgba(160,200,255,.18)}

  /* ---------- side panels ---------- */
  aside{position:fixed;z-index:15;padding:12px 13px;max-height:calc(100vh - 140px);overflow-y:auto}
  #leftPanel{left:10px;top:74px;width:238px}
  #rightPanel{right:10px;top:74px;width:266px}
  aside::-webkit-scrollbar{width:6px}
  aside::-webkit-scrollbar-thumb{background:rgba(120,170,255,.3);border-radius:3px}
  h3{margin:0 0 8px;font-size:11px;letter-spacing:1.6px;color:var(--accent);font-weight:600;
     text-transform:uppercase}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:5px 0;font-size:12px}
  .btns{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .btns button{padding:4px 7px;font-size:11px}
  hr{border:none;border-top:1px solid rgba(160,200,255,.14);margin:11px 0}

  /* ---------- body list ---------- */
  #bodyList{display:flex;flex-direction:column;gap:1px}
  .bodyRow{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:7px;cursor:pointer;
    font-size:12px;transition:.12s}
  .bodyRow:hover{background:rgba(120,180,255,.12)}
  .bodyRow.sel{background:rgba(99,184,255,.2);box-shadow:inset 0 0 0 1px rgba(99,184,255,.45)}
  .bodyRow.center{background:rgba(255,212,94,.13);box-shadow:inset 0 0 0 1px rgba(255,212,94,.4)}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 7px currentColor;
    background:currentColor}
  .bodyRow .nm{flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bodyRow .ds{flex:0 0 auto;font-size:11px;color:var(--dim)}
  .bodyRow .pin{flex:0 0 auto;opacity:.35;font-size:11px;padding:0 2px;border-radius:4px}
  .bodyRow .pin:hover{opacity:1;background:rgba(255,212,94,.25)}

  /* ---------- detail ---------- */
  #detail .dt{display:flex;justify-content:space-between;font-size:12px;margin:3px 0}
  #detail .dt span:first-child{color:var(--dim)}
  .tagline{font-size:11px;color:var(--dim);line-height:1.6;margin-top:8px}

  #hint{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:10;
    font-size:11px;color:rgba(190,210,235,.62);background:rgba(6,10,20,.6);padding:5px 12px;
    border-radius:20px;white-space:nowrap;border:1px solid rgba(120,170,255,.12)}
  #toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;
    padding:10px 18px;border-radius:10px;font-size:13px;background:rgba(10,16,30,.92);
    border:1px solid var(--panel-brd);opacity:0;pointer-events:none;transition:opacity .35s}
  #toast.show{opacity:1}
  #frameBadge{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);z-index:12;
    font-size:13px;letter-spacing:2px;color:var(--accent2);text-shadow:0 0 14px rgba(255,212,94,.5);
    pointer-events:none;opacity:.85}
  /* #ui=0 : 纯场景，用于截图 / 嵌入网页 */
  body.no-ui #topbar, body.no-ui aside, body.no-ui #hint, body.no-ui #frameBadge{display:none}

  #btnPanels{display:none}
  @media (max-width:900px){
    #btnPanels{display:inline-block}
    #leftPanel{display:none;top:74px;z-index:30;max-height:58vh}
    body.panels-open #leftPanel{display:block}
    #rightPanel{width:200px;top:auto;bottom:44px;max-height:44vh}
    #hint{display:none}
  }
</style>
</head>
<body>
<canvas id="view"></canvas>

<header id="topbar" class="panel">
  <div class="brand">☉ 太阳系 · <b>真实轨道模拟</b></div>
  <div class="sep"></div>
  <div id="clock">
    <div id="dateText" class="mono">—</div>
    <div id="jdText" class="sub mono">—</div>
  </div>
  <div class="sep"></div>
  <div class="tgroup">
    <button id="btnReverse" title="时间倒流">⇄</button>
    <button id="btnPlay" title="暂停 / 继续 (空格)">⏸</button>
    <input id="speedSlider" type="range" min="-5" max="3.65" step="0.005" value="0">
    <span id="speedText" class="mono">—</span>
  </div>
  <div class="tgroup" id="presets"></div>
  <div class="sep"></div>
  <div class="tgroup">
    <input id="dateInput" type="datetime-local" step="60">
    <button id="btnGoto">跳转</button>
    <button id="btnNow">现在</button>
  </div>
  <button id="btnPanels" title="显示 / 隐藏设置面板">⚙ 设置</button>
</header>

<aside id="leftPanel" class="panel">
  <h3>参考系中心</h3>
  <div class="row"><span>中心天体</span>
    <select id="centerSel"></select>
  </div>
  <div class="btns">
    <button data-center="sun">日心</button>
    <button data-center="earth" class="primary">地心 ★</button>
    <button data-center="mars">火星</button>
    <button data-center="jupiter">木星</button>
  </div>
  <div class="tagline" id="centerNote"></div>

  <hr>
  <h3>视图</h3>
  <div class="row"><span>距离压缩</span><button id="tglCompress" class="on">开启</button></div>
  <div class="tagline">真实距离下内行星挤在中心；压缩按 r<sup>0.45</sup> 映射，仅用于显示，数值仍为真值。</div>
  <div class="row" style="margin-top:9px"><span>轨道线</span><button id="tglOrbits" class="on">开</button></div>
  <div class="row"><span>运动轨迹</span><button id="tglTrails" class="on">开</button></div>
  <div class="tagline">轨迹按<b>当前参考系</b>逐点记录：每个点取该时刻「天体位置 − 中心天体位置」。画下即固定不动，只有末端随天体延伸；切换中心会重绘。</div>
  <div class="row"><span>轨迹时长</span><input id="trailRange" type="range" min="10" max="6000" step="1" value="800" style="width:96px"></div>
  <div class="row"><span>—</span><span class="sub mono" id="trailText">800 天</span></div>
  <div class="row"><span>名称标签</span><button id="tglLabels" class="on">开</button></div>
  <div class="row"><span>星空背景</span><button id="tglStars" class="on">开</button></div>
  <div class="row"><span>黄道面网格</span><button id="tglGrid" class="on">开</button></div>
  <div class="row"><span>月球</span><button id="tglMoon" class="on">开</button></div>
  <div class="row"><span>冥王星</span><button id="tglPluto">关</button></div>
  <div class="row"><span>行星放大</span><input id="sizeRange" type="range" min="1" max="6" step="0.1" value="1" style="width:96px"></div>

  <hr>
  <h3>相机</h3>
  <div class="btns">
    <button id="btnFit">自动取景</button>
    <button id="btnTop">俯视黄道</button>
    <button id="btnSide">侧视</button>
    <button id="btnResetView">重置视角</button>
  </div>
</aside>

<aside id="rightPanel" class="panel">
  <h3>天体 · 相对参考系中心</h3>
  <div id="bodyList"></div>
  <hr>
  <h3 id="detailTitle">详情</h3>
  <div id="detail"></div>
  <div class="tagline" id="srcNote"></div>
</aside>

<div id="frameBadge"></div>
<div id="hint">拖拽旋转 · 滚轮缩放 · 右键拖拽平移 · 双击天体设为中心 · 空格暂停</div>
<div id="toast"></div>

<script>
/* =========================================================================
   EPHEMERIS CORE  —  pure math, no DOM.  (start marker used by verify script)
   Source: JPL "Approximate Positions of the Planets" Keplerian elements,
   1800 AD – 2050 AD (heliocentric ecliptic J2000) + abridged Meeus lunar theory.
   ========================================================================= */
/* ===== EPHEMERIS CORE START ===== */
const DEG = Math.PI / 180;
const AU_KM = 149597870.7;
const C_KM_S = 299792.458;
const J2000 = 2451545.0;
const OBLIQUITY = 23.4392911 * DEG;

// a[AU], e, I[deg], L[deg], wbar[deg], node[deg] + per-century rates.
const ELEMENTS = {
  mercury:{ a:0.38709927,e:0.20563593,I:7.00497902,L:252.25032350,wbar:77.45779628,node:48.33076593,
            ra:0.00000037,re:0.00001906,rI:-0.00594749,rL:149472.67411175,rwbar:0.16047689,rnode:-0.12534081 },
  venus:  { a:0.72333566,e:0.00677672,I:3.39467605,L:181.97909950,wbar:131.60246718,node:76.67984255,
            ra:0.00000390,re:-0.00004107,rI:-0.00078890,rL:58517.81538729,rwbar:0.00268329,rnode:-0.27769418 },
  earth:  { a:1.00000261,e:0.01671123,I:-0.00001531,L:100.46457166,wbar:102.93768193,node:0.0,
            ra:0.00000562,re:-0.00004392,rI:-0.01294668,rL:35999.37244981,rwbar:0.32327364,rnode:0.0 },
  mars:   { a:1.52371034,e:0.09339410,I:1.84969142,L:-4.55343205,wbar:-23.94362959,node:49.55953891,
            ra:0.00001847,re:0.00007882,rI:-0.00813131,rL:19140.30268499,rwbar:0.44441088,rnode:-0.29257343 },
  jupiter:{ a:5.20288700,e:0.04838624,I:1.30439695,L:34.39644051,wbar:14.72847983,node:100.47390909,
            ra:-0.00011607,re:-0.00013253,rI:-0.00183714,rL:3034.74612775,rwbar:0.21252668,rnode:0.20469106 },
  saturn: { a:9.53667594,e:0.05386179,I:2.48599187,L:49.95424423,wbar:92.59887831,node:113.66242448,
            ra:-0.00125060,re:-0.00050991,rI:0.00193609,rL:1222.49362201,rwbar:-0.41897216,rnode:-0.28867794 },
  uranus: { a:19.18916464,e:0.04725744,I:0.77263783,L:313.23810451,wbar:170.95427630,node:74.01692503,
            ra:-0.00196176,re:-0.00004397,rI:-0.00242939,rL:428.48202785,rwbar:0.40805281,rnode:0.04240589 },
  neptune:{ a:30.06992276,e:0.00859048,I:1.77004347,L:-55.12002969,wbar:44.96476227,node:131.78422574,
            ra:0.00026291,re:0.00005105,rI:0.00035372,rL:218.45945325,rwbar:-0.32241464,rnode:-0.00508664 },
  pluto:  { a:39.48211675,e:0.24882730,I:17.14001206,L:238.92903833,wbar:224.06891629,node:110.30393684,
            ra:-0.00031596,re:0.00005170,rI:0.00004818,rL:145.20780515,rwbar:-0.04062942,rnode:-0.01183482 }
};

// Visual / physical metadata (radius in km).
const BODY_META = {
  sun:    { name:'太阳',   color:'#ffd45e', radiusKm:696340,  kind:'star' },
  mercury:{ name:'水星',   color:'#a9a19a', radiusKm:2439.7,  kind:'planet' },
  venus:  { name:'金星',   color:'#e8c88a', radiusKm:6051.8,  kind:'planet' },
  earth:  { name:'地球',   color:'#5aa9f0', radiusKm:6371.0,  kind:'planet' },
  moon:   { name:'月球',   color:'#cfd3d8', radiusKm:1737.4,  kind:'moon', parent:'earth' },
  mars:   { name:'火星',   color:'#d1603d', radiusKm:3389.5,  kind:'planet' },
  jupiter:{ name:'木星',   color:'#d8a86a', radiusKm:69911,   kind:'planet' },
  saturn: { name:'土星',   color:'#e0c98a', radiusKm:58232,   kind:'planet' },
  uranus: { name:'天王星', color:'#8fd6dd', radiusKm:25362,   kind:'planet' },
  neptune:{ name:'海王星', color:'#5b7fe0', radiusKm:24622,   kind:'planet' },
  pluto:  { name:'冥王星', color:'#b9a99a', radiusKm:1188.3,  kind:'planet' }
};

const PLANET_IDS = ['mercury','venus','earth','mars','jupiter','saturn','uranus','neptune','pluto'];

/* ---------- time helpers ---------- */
function julianFromDate(ms){ return ms / 86400000 + 2440587.5; }
function dateFromJulian(jd){ return new Date((jd - 2440587.5) * 86400000); }
function centuryTT(jd){ return (jd - J2000) / 36525; }

/* ---------- Kepler solver ---------- */
function keplerSolve(M, e){
  let E = M + e * Math.sin(M) * (1 + e * Math.cos(M));   // good starting guess
  for (let i = 0; i < 80; i++){
    const f  = E - e * Math.sin(E) - M;
    const fp = 1 - e * Math.cos(E);
    const d  = f / fp;
    E -= d;
    if (Math.abs(d) < 1e-13) break;
  }
  return E;
}

/* ---------- heliocentric position of a planet (ecliptic J2000, AU) ---------- */
function elementsAt(jd, el){
  const T = centuryTT(jd);
  return {
    a:    el.a    + el.ra    * T,
    e:    el.e    + el.re    * T,
    I:    el.I    + el.rI    * T,
    L:    el.L    + el.rL    * T,
    wbar: el.wbar + el.rwbar * T,
    node: el.node + el.rnode * T,
    T
  };
}

function orbitalToEcliptic(xp, yp, q){
  const w  = (q.wbar - q.node) * DEG;
  const O  = q.node * DEG;
  const I  = q.I * DEG;
  const cw = Math.cos(w),  sw = Math.sin(w);
  const cO = Math.cos(O),  sO = Math.sin(O);
  const cI = Math.cos(I),  sI = Math.sin(I);
  return [
    (cw*cO - sw*sO*cI) * xp + (-sw*cO - cw*sO*cI) * yp,
    (cw*sO + sw*cO*cI) * xp + (-sw*sO + cw*cO*cI) * yp,
    (sw*sI)           * xp + (cw*sI)           * yp
  ];
}

function heliocentric(jd, el){
  const q = elementsAt(jd, el);
  let M = (q.L - q.wbar) % 360;
  if (M > 180) M -= 360; else if (M < -180) M += 360;
  const Mr = M * DEG;
  const E  = keplerSolve(Mr, q.e);
  const xp = q.a * (Math.cos(E) - q.e);
  const yp = q.a * Math.sqrt(Math.max(0, 1 - q.e*q.e)) * Math.sin(E);
  const p  = orbitalToEcliptic(xp, yp, q);
  return { x:p[0], y:p[1], z:p[2], r:Math.hypot(p[0],p[1],p[2]), el:q, E, M };
}

/* ---------- geocentric Moon (abridged Meeus, ~10" / few-hundred-km accuracy) ---------- */
function moonGeocentric(jd){
  const d  = jd - J2000;
  const L  = 218.3164477 + 13.17639648 * d;
  const D  = 297.8501921 + 12.19074912 * d;
  const M  = 134.9633964 + 13.06499295 * d;
  const F  = 93.2720950 + 13.22935024 * d;
  const Ms = 357.5291092 + 0.98560028 * d;
  const s  = x => Math.sin(x * DEG);

  const lonOfDate = L
    + 6.288774*s(M) + 1.274027*s(2*D - M) + 0.658314*s(2*D) + 0.213618*s(2*M)
    - 0.185116*s(Ms) - 0.114332*s(2*F) + 0.058793*s(2*D - 2*M)
    + 0.057066*s(2*D - Ms - M) + 0.053322*s(2*D + M) + 0.045758*s(2*D - Ms)
    - 0.040923*s(Ms - M) - 0.034720*s(D) - 0.030383*s(Ms + M)
    + 0.015327*s(2*D - 2*F) - 0.012528*s(M + 2*F) + 0.010980*s(M - 2*F);

  // Meeus' series is referred to the mean equinox of date; reduce to J2000 so
  // that the Moon shares the same frame as the planetary elements and stars.
  const T = (jd - J2000) / 36525;
  const lon = lonOfDate - (5028.796195 * T + 1.1054348 * T * T) / 3600;

  const lat = 5.128122*s(F) + 0.280602*s(M + F) + 0.277693*s(M - F)
    + 0.173237*s(2*D - F) + 0.055413*s(2*D - M + F) + 0.046271*s(2*D - M - F)
    + 0.032573*s(2*D + F);

  const rKm = 385000.56
    - 20905.355*Math.cos(M*DEG) - 3699.111*Math.cos((2*D - M)*DEG)
    - 2955.968*Math.cos(2*D*DEG) - 569.925*Math.cos(2*M*DEG)
    - 246.158*Math.cos((2*D - 2*M)*DEG) - 170.733*Math.cos((2*D + Ms)*DEG)
    - 152.138*Math.cos((2*D - Ms - M)*DEG) - 129.620*Math.cos((2*D - Ms)*DEG)
    - 108.967*Math.cos((Ms - M)*DEG) - 104.755*Math.cos((Ms + M)*DEG);

  const cl = Math.cos(lat*DEG), r = rKm / AU_KM;
  return [ r*cl*Math.cos(lon*DEG), r*cl*Math.sin(lon*DEG), r*Math.sin(lat*DEG), rKm ];
}

/* ---------- unified position: heliocentric ecliptic J2000, AU ---------- */
function bodyPosition(id, jd){
  if (id === 'sun') return [0,0,0];
  if (id === 'moon'){
    const e = heliocentric(jd, ELEMENTS.earth);
    const m = moonGeocentric(jd);
    return [e.x + m[0], e.y + m[1], e.z + m[2]];
  }
  const p = heliocentric(jd, ELEMENTS[id]);
  return [p.x, p.y, p.z];
}

/* velocity by central difference, AU/day */
function bodyVelocity(id, jd, h){
  h = h || 0.02;
  const a = bodyPosition(id, jd - h), b = bodyPosition(id, jd + h);
  return [ (b[0]-a[0])/(2*h), (b[1]-a[1])/(2*h), (b[2]-a[2])/(2*h) ];
}

/* osculating orbit path in heliocentric frame (Moon: geocentric path over 1 month) */
function orbitPoints(id, jd, n){
  n = n || 180;
  const out = [];
  if (id === 'sun') return out;
  if (id === 'moon'){
    // one sidereal month of the *real* perturbed geocentric path, centred on now
    const P = 27.321661;
    for (let i = 0; i <= n; i++){
      const m = moonGeocentric(jd + (i/n - 0.5) * P);
      out.push([m[0], m[1], m[2]]);
    }
    return out;
  }
  const q = elementsAt(jd, ELEMENTS[id]);
  const b = q.a * Math.sqrt(Math.max(0, 1 - q.e*q.e));
  for (let i = 0; i <= n; i++){
    const E = (i/n) * Math.PI * 2;
    out.push(orbitalToEcliptic(q.a*(Math.cos(E) - q.e), b*Math.sin(E), q));
  }

}

function eclipticLonLat(v){
  const r = Math.hypot(v[0], v[1], v[2]);
  let lon = Math.atan2(v[1], v[0]) / DEG; if (lon < 0) lon += 360;
  const lat = r > 0 ? Math.asin(v[2]/r) / DEG : 0;
  return [lon, lat, r];
}

  const ra = raDeg*DEG, de = decDeg*DEG;

  const ce = Math.cos(OBLIQUITY), se = Math.sin(OBLIQUITY);
  return [x, y*ce + z*se, -y*se + z*ce];
}

  const vx = dx*b.right[0] + dy*b.right[1] + dz*b.right[2];
  const vy = dx*b.up[0] + dy*b.up[1] + dz*b.up[2];
  if (vz < nearPlane()) return { ok:false, z:vz };

  { r0: 122170, r1: 136775, alpha: 0.32 }    // A ring - beyond the Cassini division
];
const SATURN_POLE = raDecToEcliptic(40.589, 83.537);
const SATURN_RING_AXES = (function(){
  const cr = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const u = Math.abs(SATURN_POLE[0]) > 0.9 ? [0,1,0] : [1,0,0];
  let e1 = cr(SATURN_POLE, u);
  const l = Math.hypot(e1[0], e1[1], e1[2]);
  e1 = [e1[0]/l, e1[1]/l, e1[2]/l];
  return [e1, cr(SATURN_POLE, e1)];
})();

/* half = 'far' (behind the planet) is drawn before the disc, 'near' after it */
function drawSaturnRings(id, R, depth, half){
  const vpos = frame.view[id];
  const e1 = SATURN_RING_AXES[0], e2 = SATURN_RING_AXES[1], fwd = camBasis.fwd;
  const pxToWorld = depth / camBasis.f;        // world units per screen pixel here
  const meanKm = meta('saturn').radiusKm;
  const d1 = e1[0]*fwd[0] + e1[1]*fwd[1] + e1[2]*fwd[2];
  const d2 = e2[0]*fwd[0] + e2[1]*fwd[1] + e2[2]*fwd[2];
  const phi = Math.atan2(d2, d1);              // ring direction of maximum depth
  const a0 = (half === 'far' ? phi - Math.PI/2 : phi + Math.PI/2);
  const a1 = a0 + Math.PI;
  const N = 48;
  const pt = (a, km) => {
    const rr = (km / meanKm) * R * pxToWorld;
    return project([
      vpos[0] + (Math.cos(a)*e1[0] + Math.sin(a)*e2[0]) * rr,
      vpos[1] + (Math.cos(a)*e1[1] + Math.sin(a)*e2[1]) * rr,
      vpos[2] + (Math.cos(a)*e1[2] + Math.sin(a)*e2[2]) * rr
    ]);
  };
  ctx.save();
  for (const ring of SATURN_RINGS){
    ctx.beginPath();
    let ok = true;
    for (let i = 0; i <= N; i++){
      const p = pt(a0 + (a1-a0)*i/N, ring.r1);
      if (!p.ok){ ok = false; break; }
      if (i) ctx.lineTo(p.x, p.y); else ctx.moveTo(p.x, p.y);
    }
    if (ok) for (let i = N; i >= 0; i--){
      const p = pt(a0 + (a1-a0)*i/N, ring.r0);
      if (!p.ok){ ok = false; break; }
      ctx.lineTo(p.x, p.y);
    }
    if (!ok) continue;                          // ring crosses the near plane
    ctx.closePath();
    ctx.fillStyle = 'rgba(228,208,150,' + ring.alpha + ')';
    ctx.fill('evenodd');                        // annulus, not a stroked circle
  }
  ctx.restore();
}

function drawLabels(){
  ctx.save();
  ctx.font = '12px system-ui,"Microsoft YaHei",sans-serif';
  ctx.textBaseline = 'middle';
  const placed = [];                       // simple de-clutter: skip overlapping labels
  for (const id of frame.ids){
    const s = frame.screen[id];
    if (!s || !s.ok) continue;
    const R = bodyPixelRadius(id);
    const label = meta(id).name;
    const x = s.x + R + 7, y = s.y;
    const w = ctx.measureText(label).width;
    const box = [x-4, y-9, x+w+4, y+9];
    if (placed.some(b => !(box[2] < b[0] || box[0] > b[2] || box[3] < b[1] || box[1] > b[3]))) continue;
    placed.push(box);
    ctx.fillStyle = 'rgba(4,8,16,.55)';
    ctx.fillRect(box[0], box[1], box[2]-box[0], box[3]-box[1]);
    ctx.fillStyle = state.center === id ? '#ffd45e' : 'rgba(226,236,250,.92)';
    ctx.fillText(label, x, y);
  }
  ctx.restore();
}

function drawCenterMark(){
  const p = project([0,0,0]);
  if (!p.ok) return;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,212,94,.9)';
  ctx.lineWidth = 1.2;
  const s = 16;
  ctx.beginPath();
  ctx.moveTo(p.x-s, p.y); ctx.lineTo(p.x-5, p.y);
  ctx.moveTo(p.x+5, p.y); ctx.lineTo(p.x+s, p.y);
  ctx.moveTo(p.x, p.y-s); ctx.lineTo(p.x, p.y-5);
  ctx.moveTo(p.x, p.y+5); ctx.lineTo(p.x, p.y+s);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,212,94,.9)';
  ctx.font = '12px system-ui,"Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('参考系中心 · ' + meta(state.center).name, p.x, p.y + s + 16);
  ctx.restore();
}

function draw(){
  drawCount++;
  updateCamera();
  ctx.clearRect(0, 0, W, H);
  // subtle vignette background
  const bg = ctx.createRadialGradient(W*0.5, H*0.5, 0, W*0.5, H*0.5, Math.max(W,H)*0.75);
  bg.addColorStop(0, '#070c18');
  bg.addColorStop(1, '#020306');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  if (state.showStars) drawStars();
  if (state.showGrid)  drawGrid();
  if (state.showOrbits) drawOrbits();
  if (state.showTrails) drawTrails();

  // bodies far -> near
  const order = frame.ids.slice().filter(id => frame.screen[id] && frame.screen[id].ok);
  order.sort((a,b) => frame.screen[b].z - frame.screen[a].z);
  for (const id of order) drawBody(id);

  if (state.showLabels) drawLabels();
  drawCenterMark();
}

/* ---------- simulation loop ---------- */
let lastT = performance.now();
let drawCount = 0;                  // frames actually rasterised (see '#debug')
let uiEpoch = 0;                    // bumped whenever the picture must be redrawn
let lastSig = null;
function touchUI(){ uiEpoch++; }
function renderSig(){
  const c = state.cam;
  return state.jd + '|' + c.yaw + ',' + c.pitch + ',' + c.dist + ',' + c.target.join(',') +
         '|' + state.center + '|' + state.selected + '|' + uiEpoch + '|' + W + 'x' + H;
}
function tick(now){
  requestAnimationFrame(tick);      // schedule first: one bad frame must not stop the clock
  const dt = Math.min(0.25, Math.max(0, (now - lastT) / 1000));
  lastT = now;
  if (state.playing && state.speed !== 0){
    state.jd = clampJd(state.jd + dt * state.speed);
    trailSample();
    updateClockText();
  }
  // nothing moved and nothing changed -> keep the previous frame instead of
  // re-projecting ~16k points and re-rasterising 60 times a second
  const sig = renderSig();
  if (sig === lastSig) return;
  lastSig = sig;
  computeScene();
  draw();
}

function fmtSpeed(v){
  const a = Math.abs(v);
  const sign = v < 0 ? '◀ ' : '';
  if (a < 1/86400 * 1.5) return sign + (a*86400).toFixed(2) + ' 秒/秒';
  if (a < 1/24)   return sign + (a*1440).toFixed(2) + ' 分/秒';
  if (a < 1)      return sign + (a*24).toFixed(2) + ' 时/秒';
  if (a < 30)     return sign + a.toFixed(2) + ' 天/秒';
  if (a < 365)    return sign + (a/30.4375).toFixed(2) + ' 月/秒';
  return sign + (a/365.25).toFixed(2) + ' 年/秒';
}
function syncSpeedUI(){

let lastClockStamp = '';
function updateClockText(){
  const d = dateFromJulian(state.jd);
  if (isNaN(d.getTime())){                 // never let a bad date throw out of here
    els.dateText.textContent = '—';
    els.jdText.textContent = '—';

  const iso = d.toISOString();
  const stamp = iso.slice(0,19) + '|' + state.center;
  if (stamp === lastClockStamp) return;    // nothing on screen would change
  lastClockStamp = stamp;
  els.dateText.textContent = iso.slice(0,10) + '  ' + iso.slice(11,19) + ' UTC';
  const T = centuryTT(state.jd);
  const outOfRange = state.jd < 2378497 || state.jd > 2469808;   // 1800..2050
  els.jdText.innerHTML = 'JD ' + state.jd.toFixed(4) + '   T=' + T.toFixed(4) + ' 世纪' +
    (outOfRange ? '  <span style="color:#ff9a6a">⚠ 超出 1800–2050 高精度区间</span>' : '');
  if (document.activeElement !== els.dateInput) els.dateInput.value = iso.slice(0,16);
  els.frameBadge.textContent = '参考系：' + meta(state.center).name + '中心';
}

/* URL hash: #center=earth&trail=800&date=2024-11-01&speed=0&compress=1 ... */
function applyHash(){
  const h = HASH;
  if (h.get('ui') === '0') document.body.classList.add('no-ui');   // 纯场景模式
  if (h.has('center') && ALL_CENTERS.includes(h.get('center'))) state.center = h.get('center');
  if (h.has('date')){
    const raw = h.get('date');
    const t = Date.parse(raw + (raw.length <= 10 ? 'T00:00:00Z' : ''));
    if (!isNaN(t)) state.jd = clampJd(julianFromDate(t));
  }
  if (h.has('jd')) state.jd = clampJd(num(h.get('jd'), JD_MIN, JD_MAX, state.jd));
  if (h.has('trail')) state.trailDays = num(h.get('trail'), 1, 100000, state.trailDays);
  if (h.has('speed')) state.speed = num(h.get('speed'), -1e6, 1e6, state.speed);
  if (h.has('size')) state.sizeBoost = num(h.get('size'), 0.2, 10, state.sizeBoost);
  if (h.has('compress')) state.compressed = h.get('compress') !== '0';
  if (h.has('yaw')) state.cam.yaw = num(h.get('yaw'), -1e4, 1e4, state.cam.yaw);
  if (h.has('pitch')) state.cam.pitch = num(h.get('pitch'), -1.5, 1.5, state.cam.pitch);
  if (h.has('dist')) state.cam.dist = num(h.get('dist'), 0.02, 4000, state.cam.dist);
  if (h.has('pause')) state.playing = false;
  for (const [id, key] of TOGGLES){
    if (h.has(key)) state[key] = h.get(key) !== '0';
  }
}

function fmtDist(au){

function fmtKm(km){

/* ---------- camera input ---------- */
let drag = null;
let activePointers = 0;
canvas.addEventListener('pointerdown', e => {
  activePointers++;
  if (e.pointerType === 'touch' && activePointers > 1){ drag = null; return; }  // pinch, not rotate
  canvas.setPointerCapture(e.pointerId);
  drag = { x:e.clientX, y:e.clientY, moved:0, pan:(e.button === 2 || e.shiftKey) };
  canvas.classList.add('dragging');
});
canvas.addEventListener('pointermove', e => {
  if (!drag || !e.isPrimary) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  drag.moved += Math.abs(dx) + Math.abs(dy);
  if (drag.pan){
    const b = camBasis;
    const k = state.cam.dist / b.f;
    for (let i = 0; i < 3; i++){
      state.cam.target[i] += (-dx * b.right[i] + dy * b.up[i]) * k;
    }
  } else {
    state.cam.yaw   -= dx * 0.0055;
    state.cam.pitch += dy * 0.0055;
  }
});
function endPointer(){
  activePointers = Math.max(0, activePointers - 1);
  canvas.classList.remove('dragging');
  drag = null;
}
canvas.addEventListener('pointerup', e => {
  const wasClick = drag && drag.moved < 6 && !drag.pan;
  endPointer();
  if (wasClick) pick(e.clientX, e.clientY);
});
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  state.cam.dist *= Math.exp(Math.sign(e.deltaY) * 0.11);
}, { passive:false });

/* nearest body within its own hit radius */
function pickBody(mx, my, slack){
  let best = null, bestD = 0;
  for (const id of frame.ids){
    const s = frame.screen[id];
    if (!s || !s.ok) continue;
    const d = Math.hypot(s.x - mx, s.y - my);
    const lim = bodyPixelRadius(id) + slack;
    if (d <= lim && (best === null || d < bestD)){ bestD = d; best = id; }
  }
  return best;
}
function pick(mx, my){
  const best = pickBody(mx, my, 8);
  if (best){
    state.selected = best;
    refreshList(); refreshDetail();
  }
}
canvas.addEventListener('dblclick', e => {
  const best = pickBody(e.clientX, e.clientY, 10);
  if (best) setCenter(best);
});

/* touch: pinch zoom */
let pinch = null;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 2){
    const [a,b] = e.touches;
    pinch = { d: Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY), dist: state.cam.dist };
  }
}, { passive:true });
canvas.addEventListener('touchmove', e => {
  if (pinch && e.touches.length === 2){
    const [a,b] = e.touches;
    const d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    state.cam.dist = pinch.dist * pinch.d / Math.max(1, d);
  }
}, { passive:true });
canvas.addEventListener('touchend', () => { pinch = null; }, { passive:true });

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const k = e.key;
  if (k === ' '){ e.preventDefault(); els.btnPlay.click(); }
  else if (k === 'ArrowRight'){ setJd(state.jd + Math.max(0.5, Math.abs(state.speed))); }
  else if (k === 'ArrowLeft'){  setJd(state.jd - Math.max(0.5, Math.abs(state.speed))); }
  else if (k === '+' || k === '='){ state.speed = Math.sign(state.speed||1) * Math.abs(state.speed) * 2; syncSpeedUI(); }
  else if (k === '-'){ state.speed = Math.sign(state.speed||1) * Math.abs(state.speed) / 2; syncSpeedUI(); }
  else if (k === 'r' || k === 'R'){ $('btnResetView').click(); }
  else if (k === 'f' || k === 'F'){ fitView(); }
  else if (k === 'c' || k === 'C'){
    const ids = ALL_CENTERS;
    setCenter(ids[(ids.indexOf(state.center)+1) % ids.length]);
  }
});

/* ---------- boot ---------- */
resize();
applyHash();
syncToggles();
populateCenterButtons();
computeScene();
buildBodyList();
setCenter(state.center);
/* an explicit camera in the link wins over auto-framing (validated, never NaN) */
if (HASH.has('dist'))  state.cam.dist  = num(HASH.get('dist'),  0.02, 4000, state.cam.dist);
if (HASH.has('yaw'))   state.cam.yaw   = num(HASH.get('yaw'),  -1e4, 1e4, state.cam.yaw);
if (HASH.has('pitch')) state.cam.pitch = num(HASH.get('pitch'), -1.5, 1.5, state.cam.pitch);
state.selected = state.center;
els.btnPlay.textContent = state.playing ? '⏸' : '▶';
els.btnPlay.classList.toggle('on', !state.playing);
refreshList();
syncSpeedUI();
updateClockText();

/* debug/automation hook: window.__solar, plus '#debug' dumps state into the title */
window.__solar = {
  state, computeScene, project, fitView, resetTrails, setCenter, bodyPosition, draw,
  get frame(){ return frame; },
  get camBasis(){ return camBasis; },
  get trails(){ return trailStore; }
};
if (location.hash.indexOf('debug') >= 0){
  setInterval(() => {                      // rewritten continuously so a late DOM
    const rows = frame.ids.map(id => {     // dump captures the latest state
      const s = frame.screen[id];
      return id + '=' + (s && s.ok ? Math.round(s.x) + ',' + Math.round(s.y) + ',z' + s.z.toFixed(2) : 'CULLED');
    });
    document.title = 'DBG ' + JSON.stringify({
      W, H, DPR, cw: canvas.clientWidth, ch: canvas.clientHeight,
      ix: window.innerWidth, iy: window.innerHeight, cam: state.cam,
      f: Math.round(camBasis.f), draws: drawCount
    }) + ' :: ' + rows.join(' ');
  }, 300);
}

requestAnimationFrame(tick);
/* panels only need re-rendering when the clock or the selection actually moved */
let lastPanelKey = null;
setInterval(() => {
  const key = state.jd + '|' + state.selected + '|' + state.center;
  if (key === lastPanelKey) return;
  lastPanelKey = key;
  refreshList();
  refreshDetail();
}, 700);

})();
</script>
</body>
</html>
